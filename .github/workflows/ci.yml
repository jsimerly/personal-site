name: CI

# The three required checks for merging into main: API, Frontend, and E2E.
# No path filters on purpose: a required check that never runs blocks the PR.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements*.txt

      - run: pip install -r requirements-dev.txt

      # The coverage floor lives in .coveragerc.
      - run: pytest --cov

      # Loads the prod settings the way Cloud Run will and fails on any deploy
      # warning, so a prod-only misconfiguration shows up here first.
      - name: Check prod settings
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          python manage.py check --deploy --fail-level WARNING --settings=api.settings.prod
        env:
          ALLOWED_HOSTS: ci.invalid
          LEADS_EMAIL: jacob@ci.invalid
          EMAIL_APP_PASSWORD: ci-not-a-password

      - name: Test catalog is current
        run: |
          python scripts/build_test_catalog.py
          git diff --exit-code TESTING.md || { echo "::error::api/TESTING.md is stale. Run python scripts/build_test_catalog.py and commit it."; exit 1; }

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      # The coverage thresholds live in vite.config.js.
      - run: npm run test:coverage
      - run: npm run build

      - name: Test catalog is current
        run: |
          npm run test:catalog
          git diff --exit-code TESTING.md || { echo "::error::frontend/TESTING.md is stale. Run npm run test:catalog and commit it."; exit 1; }

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    env:
      # playwright.config.js defaults to the local api/.venv; CI has no venv.
      E2E_API_PYTHON: python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: pip install -r api/requirements.txt

      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Playwright boots Django and the built site itself, same as locally.
      - working-directory: frontend
        run: npm run e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/e2e/test-results
